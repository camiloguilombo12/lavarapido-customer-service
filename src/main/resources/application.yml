spring:
  # respuestas de error sin mensajes internos ni trazas (en Spring Boot 4 reemplaza a server.error.*)
  web:
    error:
      include-message: never
      include-stacktrace: never
  application:
    name: customer-service
  # En local arranca con dev, salvo que se diga otra cosa con SPRING_PROFILES_ACTIVE.
  profiles:
    default: dev
  # Los secretos van en lavarapido-infra/.env, que no se sube al repositorio. Si este servicio
  # tiene su propio .env, ese gana. Las variables de entorno mandan sobre los dos.
  config:
    import:
      - optional:file:../lavarapido-infra/.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=LavaRapido;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # las tablas las crea Liquibase, Hibernate solo revisa que el mapeo cuadre
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        use_nationalized_character_data: true

  # RabbitMQ (ADR-004): solo se conecta con MESSAGING_ENABLED=true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${MESSAGING_ENABLED:false}
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Cada servicio tiene su propia tabla de changelog, porque los seis migran la misma base.
    database-change-log-table: DATABASECHANGELOG_CUSTOMER
    database-change-log-lock-table: DATABASECHANGELOGLOCK_CUSTOMER

server:
  port: ${PORT:3002}
  shutdown: graceful

security:
  jwt:
    # El mismo secreto, emisor y audiencia que usa security-service. Este servicio solo revisa
    # el token, no lo emite ni guarda contrasenas.
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:lavarapido-security-service}
    audience: ${JWT_AUDIENCE:lavarapido-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:1h}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8081}
  messaging:
    # false: el perfil del cliente se crea la primera vez que entra (consultando security-service)
    enabled: ${MESSAGING_ENABLED:false}
  security-service:
    # de aqui se lee el person_id cuando el evento de registro no llego
    base-url: ${SECURITY_SERVICE_URL:http://localhost:3001/api/v1}
    timeout: ${SECURITY_SERVICE_TIMEOUT:3s}
  booking-service:
    # BIZ-08: antes de retirar un vehiculo se le pregunta a booking si tiene reservas activas
    # (GET /internal/v1/bookings/active-count). Es la raiz de booking, sin ruta; en docker,
    # http://booking-service:3003
    base-url: ${BOOKING_SERVICE_URL:http://localhost:3003}
    timeout: ${BOOKING_SERVICE_TIMEOUT:3s}
  # llave compartida X-Internal-Key para las rutas /internal/** de booking (la misma INTERNAL_API_KEY
  # de los demas servicios). Vacia: retirar un vehiculo responde 503, porque no se pueden revisar
  # sus reservas
  internal:
    api-key: ${INTERNAL_API_KEY:}

# Swagger apagado por defecto; application-dev.yml lo prende
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    rabbit:
      enabled: ${MESSAGING_ENABLED:false}
  info:
    env:
      enabled: true

info:
  service: customer-service

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
